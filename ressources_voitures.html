</style><script defer src="vce-shared-nav.js"></script><link rel="stylesheet" href="vce-v6-theme.css"><link rel="stylesheet" href="vce-v7.css"><script defer src="vce-v7.js"></script><link rel="stylesheet" href="vce-v8.css"><script defer src="vce-v8.js"></script><link rel="stylesheet" href="vce-v11.css"><script defer src="vce-v11-nav.js"></script><link rel="stylesheet" href="vce-chrono-global.css"><link rel="stylesheet" href="vce-theme-v17.css"><link rel="stylesheet" href="vce-v18.css"><script defer src="vce-v18-global.js"></script><link rel="stylesheet" href="vce-global-v19.css"><script defer src="vce-global-v19.js"></script><link rel="stylesheet" href="vce-design-refresh-v20.css"><script defer src="vce-design-refresh-v20.js"></script></head><body><h1>VCE — Fiches voitures et catégories</h1><p><a href="interactions.html">Ouvrir le moteur de coaching</a></p><p>Fiches issues du document transmis. Les caractéristiques sont indicatives et dépendent des versions et des règlements.</p><input id="search" placeholder="Rechercher catégorie, voiture, ABS, TC..."/><p id="count"></p><main id="cards"></main><script type="application/json" id="data">{"titre":"VCE — Ressources voitures et catégories","source":"Markdown collé.md fourni par utilisateur","avertissement":"Caractéristiques générales par catégorie. Elles peuvent varier selon génération, règlement, modèle et réglages du serveur. Une assistance du simulateur peut différer de l’équipement réel.","categories":[{"id":"CAT-001","nom":"GT3 / LMGT3","famille":"GT / Tourisme","abs":"OUI","tc":"OUI","transmission":"principalement propulsion","aero":"élevée","moteur":"Non précisé","contenu":"ABS : OUI | TC : OUI | Transmission : principalement propulsion | Aéro : élevée\n\n- Moteurs avant, centraux ou arrière selon le constructeur.\n- Puissance généralement autour de 500 à 600 ch, selon l'homologation et la BoP.\n- Boîtes séquentielles à palettes.\n- Pneumatiques slicks et pluie.\n- ABS et TC réglables par niveaux.\n- Forte capacité de freinage.\n- Sensibilité à la température des pneus et à l'équilibre aérodynamique.\n\nProblèmes et solutions :\n\n| Problème                | Causes possibles                             | Corrections                                       |\n| ----------------------- | -------------------------------------------- | ------------------------------------------------- |\n| Sous-virage en entrée   | Frein relâché trop tôt, vitesse excessive    | Travailler le freinage dégressif                  |\n| Sous-virage au milieu   | Vitesse trop élevée, équilibre aérodynamique | Réduire la vitesse minimale, analyser le setup    |\n| Survirage en sortie     | Accélérateur trop brutal, TC trop faible     | Accélérer progressivement, ajuster le TC          |\n| ABS très actif          | Pression excessive ou adhérence limitée      | Adapter le freinage, contrôler pneus et ABS       |\n| Mauvaise motricité      | Pneus froids, différentiel, rapport engagé   | Vérifier températures et remise des gaz           |\n| Instabilité sur vibreur | Suspension, vitesse, trajectoire             | Éviter les vibreurs agressifs ou ajuster le setup |","exemples":[],"source":"section"},{"id":"CAT-002","nom":"GT2 moderne — SRO","famille":"GT / Tourisme","abs":"généralement OUI","tc":"généralement OUI","transmission":"propulsion","aero":"moyenne à élevée","moteur":"Non précisé","contenu":"ABS : généralement OUI | TC : généralement OUI | Transmission : propulsion | Aéro : moyenne à élevée\n\n- Puissance souvent supérieure à celle des GT3.\n- Moins d'appui aérodynamique qu'une GT3.\n- Accélérations puissantes.\n- Freinage dépendant davantage de l'adhérence mécanique.\n- Remise des gaz particulièrement importante.\n- Comportement variable selon les modèles.\n\nCoaching : travailler le dosage de l'accélérateur, le freinage en ligne droite, la gestion du patinage et la stabilité dans les virages rapides.","exemples":[],"source":"section"},{"id":"CAT-003","nom":"GT4","famille":"GT / Tourisme","abs":"généralement OUI","tc":"généralement OUI","transmission":"principalement propulsion","aero":"faible à moyenne","moteur":"Non précisé","contenu":"ABS : généralement OUI | TC : généralement OUI | Transmission : principalement propulsion | Aéro : faible à moyenne\n\n- Puissance souvent entre 350 et 500 ch.\n- Voitures proches de leurs versions routières.\n- Moins d'appui qu'en GT3.\n- Suspensions et masses plus sensibles aux transferts de charge.\n- Freinage moins performant qu'en GT3.\n- Grande importance de la vitesse minimale en virage.\n\nCoaching : éviter les entrées trop rapides, travailler les transferts de masse, préserver la motricité et limiter les mouvements brusques du volant.","exemples":[],"source":"section"},{"id":"CAT-004","nom":"GTE / LMGTE","famille":"GT / Tourisme","abs":"NON","tc":"OUI","transmission":"propulsion","aero":"élevée","moteur":"Non précisé","contenu":"ABS : NON | TC : OUI | Transmission : propulsion | Aéro : élevée\n\n- Voitures d'endurance de génération antérieure aux LMGT3.\n- Pneus slicks de compétition.\n- TC réglable.\n- Freinage sans ABS.\n- Forte sensibilité au blocage des roues.\n- Aérodynamique avancée.\n\nCoaching : travailler la pression maximale au freinage, le relâchement progressif, la répartition de freinage et le contrôle des blocages avant/arrière.","exemples":[],"source":"section"},{"id":"CAT-005","nom":"Porsche Carrera Cup 992 / Supercup 992","famille":"GT / Tourisme","abs":"NON","tc":"NON","transmission":"propulsion","aero":"moyenne","moteur":"arrière","contenu":"ABS : NON | TC : NON | Transmission : propulsion | Moteur : arrière | Aéro : moyenne\n\n- Moteur flat-six atmosphérique.\n- Environ 510 ch pour la génération 992 GT3 Cup.\n- Boîte séquentielle.\n- Masse importante sur le train arrière.\n- Très bonne motricité si les pneus sont en température.\n- Freinage exigeant sans ABS.\n- Réactions marquées aux transferts de charge.\n\nCoaching :\n\n- Blocage avant : diminuer la pression ou améliorer le freinage dégressif.\n- Blocage arrière : contrôler la répartition et les rétrogradages.\n- Survirage en sortie : réduire le braquage avant d'accélérer fortement.\n- Survirage à la décélération : vérifier les transferts de charge et le différentiel.\n- Mauvaise rotation : analyser la vitesse d'entrée et la phase de relâchement du frein.","exemples":[],"source":"section"},{"id":"CAT-006","nom":"Lamborghini Super Trofeo","famille":"GT / Tourisme","abs":"OUI","tc":"OUI","transmission":"propulsion","aero":"Non précisé","moteur":"central arrière","contenu":"ABS : OUI | TC : OUI | Transmission : propulsion | Moteur : central arrière\n\n- Moteur V10 atmosphérique.\n- Puissance élevée.\n- Boîte séquentielle.\n- Freinage avec ABS de compétition.\n- TC réglable.\n- Réactions rapides au changement de direction.\n\nCoaching : travailler la progressivité des commandes, la gestion du TC, le freinage et les vibreurs.","exemples":[],"source":"section"},{"id":"CAT-007","nom":"Ferrari Challenge","famille":"GT / Tourisme","abs":"variable selon génération","tc":"variable selon génération","transmission":"propulsion","aero":"Non précisé","moteur":"Non précisé","contenu":"ABS : variable selon génération | TC : variable selon génération | Transmission : propulsion\n\n- Championnat monotype.\n- Voitures très puissantes.\n- Électronique spécifique au modèle.\n- Caractéristiques différentes entre 458, 488 et 296 Challenge.\n\nCoaching : identifier obligatoirement la génération avant de proposer un réglage d'ABS ou de TC.","exemples":[],"source":"section"},{"id":"CAT-008","nom":"GT1 historiques","famille":"GT / Tourisme","abs":"variable","tc":"variable","transmission":"propulsion","aero":"élevée pour l'époque","moteur":"Non précisé","contenu":"ABS : variable | TC : variable | Transmission : propulsion | Aéro : élevée pour l'époque\n\n- Puissances parfois très élevées.\n- Électronique dépendante de la génération.\n- Freinage et comportement variables.\n- Voitures souvent lourdes et exigeantes.\n\nCoaching : privilégier les fiches par voiture et par année plutôt qu'une règle universelle GT1.","exemples":[],"source":"section"},{"id":"CAT-009","nom":"DTM Class 1","famille":"GT / Tourisme","abs":"NON","tc":"NON","transmission":"propulsion","aero":"très élevée","moteur":"Non précisé","contenu":"ABS : NON | TC : NON | Transmission : propulsion | Aéro : très élevée\n\n- Monocoque de compétition.\n- Très forte puissance.\n- Appui aérodynamique important.\n- Freinage sans ABS.\n- Accélérateur exigeant sans TC.\n\nCoaching : freinage dégressif, motricité, gestion de l'appui et stabilité au changement de direction.\n\n# 3. PROTOTYPES — LMP ET HYPERCARS","exemples":[],"source":"section"},{"id":"CAT-010","nom":"Hypercar LMH","famille":"Prototypes / Hypercars","abs":"NON","tc":"OUI","transmission":"variable","aero":"très élevée","moteur":"Non précisé","contenu":"ABS : NON | TC : OUI | Transmission : variable | Aéro : très élevée\n\n- Prototypes de catégorie reine en endurance.\n- Motorisation thermique ou hybride selon modèle.\n- Propulsion ou transmission intégrale hybride selon l'architecture et les règles applicables.\n- Puissance réglementée autour de 500 kW, avec équilibrage des performances (BoP).\n- Pneus slicks et pluie.\n- Gestion de l'énergie et du carburant.\n- Freinage sans ABS.\n- TC réglable, parfois avec plusieurs paramètres.\n\nProblèmes fréquents :\n\n| Problème                  | Causes possibles                       | Solutions                                 |\n| ------------------------- | -------------------------------------- | ----------------------------------------- |\n| Blocage des roues avant   | Freinage excessif, pneus froids        | Freinage dégressif                        |\n| Instabilité arrière       | Répartition de freinage, rétrogradages | Ajuster le freinage et les rétrogradages  |\n| Patinage en sortie        | Accélérateur, TC, pneus                | Ajuster la remise des gaz et le TC        |\n| Sous-virage rapide        | Aéro, vitesse, pneus                   | Analyser l'appui et la trajectoire        |\n| Surconsommation           | Accélération, cartographie, rythme     | Lift and coast, gestion de l'énergie      |\n| Difficulté avec l'hybride | Stratégie de déploiement               | Vérifier les paramètres propres au modèle |\n\nExemples : Toyota GR010 Hybrid, Ferrari 499P, Peugeot 9X8, Aston Martin Valkyrie AMR-LMH.","exemples":["Toyota GR010 Hybrid","Ferrari 499P","Peugeot 9X8","Aston Martin Valkyrie AMR-LMH"],"source":"section"},{"id":"CAT-011","nom":"Hypercar LMDh / GTP","famille":"Prototypes / Hypercars","abs":"NON","tc":"OUI","transmission":"propulsion","aero":"très élevée","moteur":"Non précisé","contenu":"ABS : NON | TC : OUI | Transmission : propulsion | Aéro : très élevée\n\n- Châssis homologués provenant de constructeurs spécialisés.\n- Système hybride standardisé.\n- Moteurs thermiques de différentes architectures.\n- Freinage sans ABS.\n- TC de compétition.\n- Gestion du déploiement électrique.\n- Comportement dépendant de la BoP.\n\nExemples : Porsche 963, Cadillac V-Series.R, BMW M Hybrid V8, Alpine A424, Lamborghini SC63, Acura ARX-06.\n\nCoaching : freinage dégressif, contrôle de la motricité, gestion du freinage régénératif, pneus et équilibre aérodynamique.","exemples":["Porsche 963","Cadillac V-Series.R","BMW M Hybrid V8","Alpine A424","Lamborghini SC63","Acura ARX-06"],"source":"section"},{"id":"CAT-012","nom":"LMP1 hybride","famille":"Prototypes / Hypercars","abs":"NON","tc":"OUI","transmission":"variable","aero":"extrême","moteur":"Non précisé","contenu":"ABS : NON | TC : OUI | Aéro : extrême | Transmission : variable\n\n- Ancienne catégorie reine du WEC.\n- Puissance combinée thermique et hybride élevée.\n- Récupération d'énergie.\n- Forte vitesse de passage en courbe.\n- Freinage très puissant.\n- Comportement dépendant de la stratégie hybride.\n\nExemples : Porsche 919 Hybrid, Toyota TS050 Hybrid, Audi R18 e-tron quattro.","exemples":["Porsche 919 Hybrid","Toyota TS050 Hybrid","Audi R18 e-tron quattro"],"source":"section"},{"id":"CAT-013","nom":"LMP1 non hybride","famille":"Prototypes / Hypercars","abs":"NON","tc":"généralement OUI","transmission":"propulsion","aero":"Non précisé","moteur":"Non précisé","contenu":"ABS : NON | TC : généralement OUI | Transmission : propulsion\n\n- Moteurs thermiques puissants.\n- Très fort appui aérodynamique.\n- Pas de déploiement hybride.\n- Freinage sans ABS.\n- Forte sensibilité aux pneus et à la hauteur de caisse.","exemples":[],"source":"section"},{"id":"CAT-014","nom":"LMP2","famille":"Prototypes / Hypercars","abs":"NON","tc":"OUI","transmission":"propulsion","aero":"très élevée","moteur":"Non précisé","contenu":"ABS : NON | TC : OUI | Transmission : propulsion | Aéro : très élevée\n\n- Prototype d'endurance.\n- Moteur central arrière.\n- Boîte séquentielle.\n- Freinage sans ABS.\n- Contrôle de traction réglable.\n- Très bonne vitesse de passage en courbe.\n- Pneus particulièrement importants pour la performance.\n\nExemples : Oreca 07, Dallara P217, Ligier JS P217, Riley Mk. 30.\n\nCoaching :\n\n- Blocage avant : réduire progressivement la pression lorsque la vitesse diminue.\n- Survirage rapide : analyser le niveau d'appui arrière et les mouvements de volant.\n- Patinage : vérifier le TC et le dosage d'accélérateur.\n- Mauvaise rotation : analyser la phase de freinage et le différentiel.\n- Instabilité sur vibreur : vérifier la trajectoire et les suspensions.","exemples":["Oreca 07","Dallara P217","Ligier JS P217","Riley Mk. 30"],"source":"section"},{"id":"CAT-015","nom":"LMP3","famille":"Prototypes / Hypercars","abs":"généralement NON","tc":"selon modèle et génération","transmission":"propulsion","aero":"élevée","moteur":"Non précisé","contenu":"ABS : généralement NON | TC : selon modèle et génération | Transmission : propulsion | Aéro : élevée\n\n- Prototype d'entrée en endurance.\n- Puissance inférieure aux LMP2.\n- Moteur central arrière.\n- Boîte séquentielle.\n- Freinage exigeant.\n- Aides électroniques dépendantes de la génération.\n\nExemples : Ligier JS P320, Duqueine D08, Ginetta G61-LT-P3.","exemples":["Ligier JS P320","Duqueine D08","Ginetta G61-LT-P3"],"source":"section"},{"id":"CAT-016","nom":"Group C","famille":"Prototypes / Hypercars","abs":"généralement NON","tc":"généralement NON","transmission":"propulsion","aero":"élevée","moteur":"Non précisé","contenu":"ABS : généralement NON | TC : généralement NON | Transmission : propulsion | Aéro : élevée\n\n- Prototypes historiques des années 1980 et 1990.\n- Moteurs souvent turbocompressés.\n- Forte puissance.\n- Boîtes manuelles ou séquentielles selon modèle.\n- Peu d'assistance électronique moderne.\n- Risque important de survirage sous accélération.\n\nExemples : Porsche 962C, Mazda 787B, Sauber Mercedes C9, Jaguar XJR-9.\n\nCoaching : gestion du turbo, progressivité de l'accélérateur, freinage sans ABS et anticipation des transferts de charge.\n\n# 4. MONOPLACES ET OPEN WHEEL\n\n| Catégorie               | ABS        | TC         | Transmission                       | Caractéristiques                |\n| ----------------------- | ---------- | ---------- | ---------------------------------- | ------------------------------- |\n| F1 moderne              | Non        | Non        | Propulsion                         | Appui extrême, hybride          |\n| F1 2004                 | Non        | Oui        | Propulsion                         | V10, TC réglementaire           |\n| F1 2008–2013            | Non        | Non        | Propulsion                         | V8, forte aéro                  |\n| F1 historique           | Variable   | Variable   | Propulsion                         | Dépend de l'année               |\n| F2 moderne              | Non        | Non        | Propulsion                         | Forte puissance, gros appui     |\n| F3 moderne              | Non        | Non        | Propulsion                         | Vitesse de passage élevée       |\n| F4                      | Non        | Non        | Propulsion                         | Faible puissance, formation     |\n| Formula Regional        | Non        | Non        | Propulsion                         | Intermédiaire F4/F3             |\n| Formula Renault 2.0     | Non        | Non        | Propulsion                         | Légère, précise                 |\n| Formula Renault 3.5     | Non        | Non        | Propulsion                         | Puissante, aéro élevée          |\n| IndyCar                 | Non        | Non        | Propulsion                         | Ovales et circuits routiers     |\n| Indy NXT                | Non        | Non        | Propulsion                         | Formation IndyCar               |\n| Super Formula           | Non        | Non        | Propulsion                         | Appui très élevé                |\n| Formula Ford            | Non        | Non        | Propulsion                         | Peu ou pas d'appui              |\n| Formula Vee             | Non        | Non        | Propulsion                         | Faible puissance                |\n| Formula Mazda           | Non        | Non        | Propulsion                         | Légère, conduite précise        |\n| Formula 1600            | Non        | Non        | Propulsion                         | Pilotage mécanique              |\n| Formula 5000            | Non        | Non        | Propulsion                         | Très forte puissance historique |\n| Formula Atlantic        | Non        | Non        | Propulsion                         | Légère, rapide                  |\n| GP2                     | Non        | Non        | Propulsion                         | Ancienne F2                     |\n| GP3                     | Non        | Non        | Propulsion                         | Ancienne F3                     |\n| Formula E               | Spécifique | Spécifique | Propulsion ou 4RM selon génération | Freinage régénératif            |\n| Caterham de compétition | Variable   | Variable   | Propulsion                         | Légère, faible aéro             |","exemples":["Porsche 962C","Mazda 787B","Sauber Mercedes C9","Jaguar XJR-9"],"source":"section"},{"id":"CAT-017","nom":"F1 moderne","famille":"Monoplaces / Open Wheel","abs":"NON","tc":"NON","transmission":"Non précisé","aero":"extrême","moteur":"Non précisé","contenu":"ABS : NON | TC : NON | Aéro : extrême\n\nProblèmes prioritaires : blocage des roues, patinage en sortie, sous-virage rapide, instabilité au freinage, température des pneus, gestion du différentiel et de l'énergie.\n\nLe coach ne doit jamais recommander d'augmenter le TC ou l'ABS sur une F1 moderne conforme à son règlement.","exemples":[],"source":"section"},{"id":"CAT-018","nom":"F1 2004","famille":"Monoplaces / Open Wheel","abs":"NON","tc":"OUI","transmission":"Non précisé","aero":"Non précisé","moteur":"Non précisé","contenu":"ABS : NON | TC : OUI\n\nUne Ferrari F2004 possède un contrôle de traction, contrairement à une F1 moderne. Il est donc essentiel de ne pas appliquer une seule fiche technique à toutes les générations de Formule 1.","exemples":[],"source":"section"},{"id":"CAT-019","nom":"F2 / F3 / Formula Regional","famille":"Monoplaces / Open Wheel","abs":"NON","tc":"NON","transmission":"Non précisé","aero":"Non précisé","moteur":"Non précisé","contenu":"ABS : NON | TC : NON\n\nPriorités : freinage dégressif, conservation de la vitesse en courbe, précision des trajectoires, contrôle de l'accélérateur et gestion des pneumatiques.","exemples":[],"source":"section"},{"id":"CAT-020","nom":"F4","famille":"Monoplaces / Open Wheel","abs":"NON","tc":"NON","transmission":"Non précisé","aero":"faible à modérée","moteur":"Non précisé","contenu":"ABS : NON | TC : NON | Aéro : faible à modérée\n\n- Faible puissance par rapport aux catégories supérieures.\n- Peu d'assistance électronique.\n- Importance de la vitesse minimale.\n- Sensibilité aux transferts de charge.\n- Surpilotage particulièrement pénalisant.\n\nCoaching : privilégier la fluidité, la précision des points de corde et la conservation de la vitesse.","exemples":[],"source":"section"},{"id":"CAT-021","nom":"IndyCar","famille":"Monoplaces / Open Wheel","abs":"NON","tc":"NON","transmission":"Non précisé","aero":"variable selon circuit","moteur":"Non précisé","contenu":"ABS : NON | TC : NON | Aéro : variable selon circuit\n\n- Puissance élevée.\n- Configurations aérodynamiques différentes entre ovales et circuits routiers.\n- Freinage exigeant.\n- Gestion du carburant.\n- Forte sensibilité à l'équilibre de la voiture.\n\nCoaching : séparer les diagnostics ovales et circuits routiers.\n\n# 5. TOURISME ET CATÉGORIES SPÉCIALES\n\n| Catégorie         | ABS                           | TC                  | Particularités                          |\n| ----------------- | ----------------------------- | ------------------- | --------------------------------------- |\n| TCR / WTCR        | Selon règlement et génération | Selon règlement     | Traction avant, gestion des pneus avant |\n| WTCC TC1          | Généralement non              | Généralement non    | Tourisme de compétition                 |\n| DTM GT3 moderne   | Oui                           | Oui                 | Réglementation GT3                      |\n| DTM Class 1       | Non                           | Non                 | Forte puissance, gros appui             |\n| DTM historique    | Variable                      | Variable            | Selon année                             |\n| BMW M2 CS Racing  | Selon configuration           | Selon configuration | Monotype, propulsion                    |\n| Mazda MX-5 Cup ND | Non                           | Non                 | Faible puissance, propulsion            |\n| Caterham Academy  | Selon version                 | Selon version       | Légère, propulsion                      |\n| Radical SR3       | Selon version                 | Selon version       | Prototype léger
